apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: riftregulars
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts: [riftregulars.agusbravo.dev]
      secretName: riftregulars-tls
  rules:
    - host: riftregulars.agusbravo.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: riftregulars
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: riftregulars-api
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: riftregulars-riftregulars-api-rate@kubernetescrd,riftregulars-riftregulars-inflight@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [riftregulars.agusbravo.dev]
      secretName: riftregulars-tls
  rules:
    - host: riftregulars.agusbravo.dev
      http:
        paths:
          - path: /api/history
            pathType: Exact
            backend:
              service:
                name: riftregulars
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: riftregulars-player
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: riftregulars-riftregulars-player-rate@kubernetescrd,riftregulars-riftregulars-inflight@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [riftregulars.agusbravo.dev]
      secretName: riftregulars-tls
  rules:
    - host: riftregulars.agusbravo.dev
      http:
        paths:
          - path: /player
            pathType: Prefix
            backend:
              service:
                name: riftregulars
                port:
                  number: 80
