apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: riftregulars
  namespace: argocd
spec:
  commonUpdateSettings:
    updateStrategy: digest
  writeBackConfig:
    method: argocd
  applicationRefs:
    - namePattern: riftregulars
      images:
        - alias: riftregulars
          imageName: ghcr.io/agustinbravop/riftregulars:latest
