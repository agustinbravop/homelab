apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: website
  namespace: argocd
  annotations:
    argocd.argoproj.io/refresh: hard
    argocd.image-updater.argoproj.io/write-back-method: annotation
    argocd.image-updater.argoproj.io/image-list: website=ghcr.io/agustinbravop/website
    argocd.image-updater.argoproj.io/website.update-strategy: digest
spec:
  project: default
  source:
    repoURL: https://github.com/agustinbravop/homelab
    targetRevision: main
    path: apps/website
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
